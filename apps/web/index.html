    <!--
      THESIS: A control plane read as a lit operations desk, not a night-shift
      terminal. It refuses the dark near-black instrument panel the category
      ships for agent tooling, and refuses the metric-hero dashboard too: state
      lives on the row it belongs to.
      OWN-WORLD: Warm off-white chrome (#FAFAF9) behind white working panels,
      one hairline (#EBEBE8), 8px controls / 10px panels, Inter, near-black as
      the single solid surface, status as tinted pills — emerald running, amber
      waiting on you, rose broken.
      STORY: The operator sees what ran, what broke, and what is parked on them,
      then answers it.
      FIRST VIEWPORT: Left rail of grouped destinations; top bar carrying running
      and waiting counts; the Tasks board with four columns under a row of real
      counts.
      FORM: Brief-pinned direction — the user supplied 31 reference frames
      (design-refs/), so no concept-seed roll was run.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the
      finish review, the verdict, and DESIGN.md.
    -->

    <script type="module" src="/src/main.tsx"></script>
  </body>
