skills:
  accessible-interface:
    body: |-
      An interface is not done when it renders.

      Build every state: loading, empty, error, partial, and far-too-much-data. The
      empty state says what puts something there.

      Semantic elements first — a button is a `button` — and ARIA only where the
      semantics genuinely run out. Everything reachable and operable by keyboard,
      with focus visible at every stop and a sensible order. Nothing conveyed by
      colour alone. Contrast that holds in both themes.

      On touch, no control below a real tap target. Check a narrow width as well as
      a wide one, and say which widths you checked — "responsive" without two
      numbers is an assertion.
    category: frontend
    description: Semantics first, every state designed, keyboard and focus working, and real tap
      targets. Grant it to any agent writing interface code.
    filePath: null
    kind: prompt
    name: Accessible interface
  commit-discipline:
    body: |-
      Commit only what the task asked for.

      One commit per coherent change, with a message that says why rather than what —
      the diff already says what. Never commit a credential, a .env file, or a token,
      even one that appears in a fixture. Never disable a failing test to make a
      commit pass; a failing test is a finding, and it belongs in the inbox.

      You have git-write only if your manifest says so. If it does not, write your
      work to the agent filesystem instead and say where you put it.
    category: engineering
    description: One coherent change per commit, a message that says why, and never a credential or a
      disabled test. Grant it to any agent with git-write.
    filePath: null
    kind: prompt
    name: Commit discipline
  container-hygiene:
    body: |-
      Build images that are small, cacheable, and boring.

      Multi-stage: compile in one stage, copy only the artefact into a slim runtime
      stage. Install dependencies in their own layer, before copying source, so a
      code change does not invalidate the dependency cache.

      Never bake a secret into an image or pass one as a build argument — both
      persist in the layer history. Take credentials at runtime from the environment.

      Run as a non-root user. Pin base images by digest or at least by minor
      version; `latest` makes a build that worked yesterday fail today for reasons
      nobody changed.
    category: devops
    description: Small images, cached dependency layers, no build tools or secrets in the runtime stage,
      non-root user. Grant it to agents editing Dockerfiles or deploy config.
    filePath: null
    kind: prompt
    name: Container hygiene
  context-discipline:
    body: |-
      Read narrowly and deliberately. A long session that read everything is worse
      than a short one that read the right thing.

      Locate before you load: search for the symbol, then read the region around it,
      then widen only if the answer is not there. Read whole files when they are
      small or when structure is the question, not by default.

      When you learn something the next step will need — where a thing lives, what a
      convention is, what you ruled out — write it onto the task or into your
      folder. A finding that exists only in this session's transcript is lost the
      moment the container is destroyed, and this container always is.
    category: general
    description: Retrieve progressively — narrow searches before whole files — and summarise findings
      into the task rather than the transcript. Grant it to agents working in large repositories.
    filePath: null
    kind: prompt
    name: Context discipline
  design-system-discipline:
    body: |-
      Work in the system, not in the screen.

      Use the existing tokens for colour, spacing, radius and type. If you need a
      value the system does not have, add it to the system and say why — an inline
      hex or a magic pixel is a fork of the design that nobody will find again.

      Reach for the existing component before writing a new one, and extend it
      rather than copying it. Two components doing one job will drift.

      Each colour role carries one meaning and keeps it. Reusing the hue that means
      "waiting on you" for something that is merely a fact dilutes the one signal
      the operator relies on. Where the repository has a design document, it
      outranks your judgement, and you cite the rule you applied.
    category: frontend
    description: Use the project's tokens and components; extend the system rather than inlining a
      one-off value. Grant it alongside any interface work.
    filePath: null
    kind: prompt
    name: Design system discipline
  document-ingestion-discipline:
    body: |-
      Most bad retrieval is bad ingestion. Check what the parser actually produced
      before tuning anything downstream: tables flattened into word salad, headings
      lost, code blocks reflowed, and page furniture repeated into every chunk are the
      usual damage, and none of it shows up until answers are subtly wrong.

      Normalise deliberately — whitespace, encoding, boilerplate removal — and keep
      the original alongside the derived text so a reparse is possible without
      refetching.

      Every chunk carries provenance: source id, version, location within the
      document, and ingestion timestamp. Without it citations cannot be verified and
      deletion cannot be targeted.

      Version the pipeline itself, including the embedding model. Changing the
      embedding model invalidates the whole index — vectors from two models are not
      comparable — so treat it as a reindex with a rollback plan, not a config
      change.
    category: data
    description: Parse and normalise documents without silently destroying structure, and version the
      pipeline so a reindex is reproducible. Grant it to agents building ingestion for a retrieval
      system.
    filePath: null
    kind: prompt
    name: Document ingestion discipline
  documentation-lookup:
    body: |-
      Do not implement against an API from memory.

      Check the primary source before writing the call: the vendor's own reference,
      the SDK's types, the changelog. If you were granted a documentation
      connection, use it before the open web — it is versioned and the open web is
      not.

      Check the version. An answer that was right two majors ago is a wrong answer
      delivered confidently, and it is the most common way an integration fails.

      Where the documentation and the observed behaviour disagree, say so on the
      task rather than picking one silently.
    category: research
    description: Check the versioned primary source before implementing against an SDK or API, using a
      granted documentation connection first. Grant it to agents that integrate third-party
      services.
    filePath: null
    kind: prompt
    name: Documentation lookup
  e2e-first:
    body: |-
      Run the repository's own end-to-end tests as part of implementing, not
      after it.

      Find the existing harness — do not introduce a framework the repository does
      not already use. If there is none, say so in the task activity and cover the
      change with whatever level of test the repository does have.

      A step is not done because the code was written. It is done when the check you
      named in the plan actually passes, and you have pasted the output.
    category: testing
    description: Run the repository's own end-to-end suite as part of implementing rather than after it.
      Grant it to any agent that writes code and finishes a task.
    filePath: null
    kind: prompt
    name: End-to-end first
  evidence-first-research:
    body: |-
      Report claims with their evidence attached, and mark each as verified or
      uncertain.

      Prefer the primary source. A blog post is evidence that someone believed
      something on the day they wrote it; a vendor's documentation is evidence about
      the product; the code is evidence about the code. Check the date on every one.

      Where two sources contradict each other, that is a finding — name both and say
      which you would act on and why. Do not average them into a confident middle.

      When the answer is not available, say so. A plausible answer with no source is
      the most expensive thing you can hand back, because it will be believed.
    category: research
    description: Separate what you verified from what you inferred, attach sources, and treat
      contradictions as findings. Grant it to research and analysis agents.
    filePath: null
    kind: prompt
    name: Evidence-first research
  no-fake-completion:
    body: |-
      You may not report work as done that you did not do.

      Before finishing, read back every file you changed and look for your own
      shortcuts: a TODO left where the logic belongs, a function returning a
      constant, a branch that throws "not implemented", a test marked skip or only,
      a mock standing in for the thing under test, a config value hardcoded because
      the real one was awkward to reach.

      Each of those is a blocker, not progress. Either finish it or say explicitly,
      on the task, which part you did not do and why. Scaling the work down is the
      human's decision, so it goes in the inbox — quietly delivering less than was
      asked is the one failure this system cannot see.
    category: general
    description: Treat placeholders, stubs, and skipped tests as blockers rather than progress, and
      report what was not done. Grant it to every agent that can mark a task finished.
    filePath: null
    kind: prompt
    name: No fake completion
  plan-mode:
    body: |-
      Enter plan mode before writing anything.

      Read the specification and every attachment first. Then produce an ordered
      implementation plan: each step small enough to review, named files where you
      know them, and the check that proves the step is done.

      Do not implement. Do not re-open decisions the approved spec already made. If
      the spec cannot be reached or contradicts itself, stop and inbox the human
      rather than guessing — a plan built on a guess costs more to unpick than the
      question costs to ask.
    category: planning
    description: Read everything, then produce an ordered plan with a named check per step, and
      implement nothing. Grant it to any agent whose job ends at the plan.
    filePath: null
    kind: prompt
    name: Plan mode
  pr-hygiene:
    body: |-
      One change, one concern.

      Do not fold an unrelated fix, a rename, or a reformat into the work you were
      asked to do; each one makes the diff harder to review and the revert harder to
      aim. When you notice something worth fixing that is not this task, write it on
      the task as a note and leave the code alone.

      Keep the diff readable: no reflowed lines you did not otherwise touch, no
      reordered imports as a side effect, no dependency added for a single call.

      Finish by saying, in one line, what this change does and what you deliberately
      left alone.
    category: engineering
    description: Keep a change to one concern, leave unrelated improvements alone, and say what you
      deliberately did not touch. Grant it to any agent that commits.
    filePath: null
    kind: prompt
    name: Change hygiene
  rag-architecture:
    body: |-
      Start by asking whether this needs retrieval at all. A small stable corpus
      belongs in the prompt; a question with one system of record belongs in a tool
      call. Retrieval earns its complexity when the corpus is large, changes, and has
      to be cited.

      Chunk along the document's own structure — sections, functions, row groups —
      not at a fixed token count, and make each chunk interpretable alone by carrying
      its title and path with it. State the overlap and why.

      Choose retrieval deliberately: vector for paraphrase, keyword for identifiers
      and error strings, hybrid when both matter, which is most of the time. Add a
      reranker only if you can say what it buys against its latency.

      Assembly is a budget. Say what is included, in what order, and what is dropped
      first when the budget is exceeded. Every claim an answer makes must be traceable
      to a retrieved chunk, so citations are part of the design and not a formatting
      step at the end.
    category: data
    description: Decide whether retrieval is warranted, then choose chunking, retrieval mode and
      assembly from the document structure rather than by default. Grant it to agents designing or
      reviewing a RAG system.
    filePath: null
    kind: prompt
    name: RAG architecture
  rag-security:
    body: |-
      A retrieved document is input, not instruction. Anything indexed from a
      source a user or a third party can write — tickets, wiki pages, uploaded files,
      scraped web pages — can contain text aimed at the model reading it. Keep
      retrieved content clearly delimited from instructions, never let it change the
      system prompt's rules, and be specific about which tools remain callable while
      retrieved text is in context.

      Enforce access control in the **retrieval filter**, not in the prompt. A
      document the reader may not see must be unreachable by the query, because
      "do not mention this" is not an access control and a summary leaks it anyway.

      Multi-tenant systems isolate at the index or the mandatory filter, and the
      filter is applied server-side from the authenticated identity — never from a
      value the caller supplied.

      Know where personal data is before indexing it, not after. Deletion must reach
      the vector store, the keyword index, and every cache, or "deleted" means
      "invisible in one of four places".
    category: security
    description: Treat retrieved documents as untrusted input, enforce access control in the retrieval
      filter, and keep tenants apart at the index. Grant it alongside any RAG work that touches
      private or user-supplied content.
    filePath: null
    kind: prompt
    name: RAG security
  retrieval-evaluation:
    body: |-
      Build the evaluation set before tuning anything: real questions, each with the
      documents that should have been retrieved. Fifty honest examples beat a
      thousand generated ones.

      Measure the two halves separately, because they fail differently.

      **Retrieval.** recall@k is the first number — if the right document was not in
      the top k, no prompt change can save the answer. precision@k tells you how much
      noise the model must ignore. MRR and nDCG matter only when rank order genuinely
      affects the answer; on a system that concatenates all k chunks they are
      decoration, so do not report them as if they were the goal.

      **Answers.** Faithfulness — is every claim supported by a retrieved chunk — and
      citation correctness, which is a separate question from whether the answer is
      right. An answer that is correct and cites the wrong source will be trusted the
      next time it is wrong.

      Record latency and cost per query alongside quality. A change that improves
      recall by two points and doubles latency is a trade the operator makes, not one
      you make silently.
    category: data
    description: Measure retrieval and answers separately against a fixed question set, and use recall@k
      before touching the prompt. Grant it to agents building or tuning a RAG system.
    filePath: null
    kind: prompt
    name: Retrieval evaluation
  root-cause-first:
    body: |-
      Find the cause before you change anything.

      Reproduce first: the smallest command that fails, with its exact output. If
      you cannot reproduce it, say so — a fix for a failure you never saw is a
      guess with a commit attached.

      Hold at least two explanations at once and look for the evidence that would
      rule one out, not the evidence that confirms your favourite. Say what you
      eliminated and how.

      Fix the cause, not the symptom. A retry, a widened timeout, a swallowed
      exception, or a test loosened to pass are all ways of hiding the bug rather
      than removing it, and each one is a finding you should report instead.
    category: engineering
    description: Reproduce and isolate before editing, and hold competing hypotheses rather than the
      first plausible one. Grant it to agents that debug.
    filePath: null
    kind: prompt
    name: Root cause first
  schema-change-safety:
    body: |-
      Assume the old code is still running while your migration lands, because it
      is.

      Never rename or drop in place. Expand first: add the new column or table.
      Backfill in bounded batches. Move readers, then writers, then — in a later
      deploy — contract by removing the old shape. Each of those is separately
      deployable and separately revertible.

      Name the lock every statement takes and how long it holds it on the largest
      table this touches. An index built without the concurrent option, or a type
      change that rewrites a table, is an outage with a migration file's name on it.

      Write the rollback before you write the migration. If a step cannot be rolled
      back, say so at the top of the task.
    category: data
    description: Expand, backfill, migrate readers, migrate writers, contract — each a separate deploy,
      with the lock named. Grant it to any agent that can change a database schema.
    filePath: null
    kind: prompt
    name: Schema change safety
  search-first:
    body: |-
      Before writing something new, find out whether it already exists here.

      Search the repository for the behaviour by name, by call site, and by the
      shape of the data — a helper is often named nothing like the thing you would
      have called it. Read a neighbouring file that solves the adjacent problem and
      follow the convention it establishes.

      Reach for a new dependency last, and say why the existing ones do not cover
      it. A second library doing what the first already does is a cost the whole
      repository pays.

      Where you do write something new, put it where a future search would find it.
    category: research
    description: Look for the existing helper, pattern, or dependency in this repository before writing
      a new one. Grant it to implementation agents on a mature codebase.
    filePath: null
    kind: prompt
    name: Search first
  security-review-checklist:
    body: |-
      Read a change for security in this order, and report rather than patch.

      1. **Input.** What reaches this code from outside, and what happens when it is
         not what you expect. Injection into queries, shells, templates and paths.
      2. **Authorisation.** Who is allowed to do this, and where that is checked.
         A check in the UI is not a check.
      3. **Credentials.** Secrets in code, fixtures, logs, error messages or a URL.
         A credential whose scope grew is a finding even if nothing leaked.
      4. **Failure.** When this path errors, does it open or close? Fail closed.

      Rank by what is actually reachable. Give the file, the line, the input that
      triggers it, and what the attacker gets. An empty report is a valid result and
      you should say so plainly.
    category: security
    description: The order to read a change in when looking for injection, authorisation gaps, and
      leaked credentials. Grant it to reviewers and to agents touching auth or input handling.
    filePath: null
    kind: prompt
    name: Security review checklist
  verification-loop:
    body: |-
      Nothing is finished until it is verified, and a claim is not verification.

      Run what the repository actually has, in this order, stopping to fix rather
      than continuing past a failure: install, build, type check, lint, tests.
      Take the commands from the repo's own scripts rather than inventing them.

      Report each as passed, failed, or absent — absent is a result worth saying.
      Paste the real output for anything that failed and the summary line for
      anything that passed. If a check cannot run in this session, say which one and
      why, so nobody reads its silence as a pass.
    category: testing
    description: Before finishing, run build, types, lint and tests in order and paste the real output
      for each. Grant it to any agent whose work has to be trusted without a human re-running it.
    filePath: null
    kind: prompt
    name: Verification loop
templates:
  bugfix-workflow:
    description: Approved bug report → plan → plan review → fix → E2E → you merge.
    steps:
      - agentName: plan
        approvalGate: false
        attachmentsFromPrevious: true
        name: Plan the fix
        prompt: |-
          Read the attached cause report for: {{bug}}

          Write an ordered plan for the fix on branch {{branchName}}.
      - agentName: review-coordinator
        approvalGate: false
        attachmentsFromPrevious: true
        name: Plan review
        prompt: Review the fix plan through the four lenses. Consolidate must-fix / should-fix.
      - agentName: senior-dev
        approvalGate: false
        attachmentsFromPrevious: true
        name: Fix
        prompt: Apply the reviewed plan on branch {{branchName}}. Add a regression test that fails without
          the fix. Commit.
      - agentName: senior-dev
        approvalGate: false
        attachmentsFromPrevious: true
        name: E2E test
        prompt: Run the repository's end-to-end suite against branch {{branchName}} and report the result on
          the task. If it fails, fix and re-run.
      - agentName: human
        approvalGate: true
        attachmentsFromPrevious: true
        name: Human review of deployment / PR
        prompt: Review and merge branch {{branchName}}.
    variables:
      - branchName
      - bug
  compound-engineer-workflow:
    description: "Fully managed feature build: spec (you approve) → plan → multi-agent plan review →
      revise → implement with E2E → code review → fixes → wiki → you merge."
    steps:
      - agentName: spec
        approvalGate: true
        attachmentsFromPrevious: false
        name: Write a spec
        prompt: >-
          Write a detailed specification for: {{feature}}


          Attach the spec as a file. Inbox the operator when it is ready for review. You cannot mark
          this task done — it is approval-gated.
      - agentName: plan
        approvalGate: false
        attachmentsFromPrevious: true
        name: Plan
        prompt: Turn the approved specification into a concrete, ordered implementation plan for branch
          {{branchName}}. Write the plan onto the task and attach it as a file. Do not implement.
      - agentName: review-coordinator
        approvalGate: false
        attachmentsFromPrevious: true
        name: Plan review
        prompt: Spawn the four plan reviewers — feasibility, scope-guardian, coherence, plan-risk — each
          reviewing the attached plan through its own lens only. Consolidate their reports into
          must-fix and should-fix. Attach the consolidated report. Do not implement fixes yourself.
      - agentName: plan
        approvalGate: false
        attachmentsFromPrevious: true
        name: Revise plan
        prompt: Take the plan and the consolidated review. Resolve every must-fix. Decide on each should-fix
          and say why. Attach the revised plan.
      - agentName: implementation-plan-executioner
        approvalGate: false
        attachmentsFromPrevious: true
        name: Implementation
        prompt: Implement the attached plan on branch {{branchName}}. Do not re-litigate the plan. Run the
          repository's existing end-to-end tests as part of this work — if the repo has an E2E
          suite, it must pass before you finish. Commit.
      - agentName: code-review-coordinator
        approvalGate: false
        attachmentsFromPrevious: true
        name: Code review
        prompt: Review the implementation on branch {{branchName}}. Spawn the code-review specialists on
          your collaboration list — security-reviewer, test-auditor, simplifier,
          performance-reviewer — each reading through its own lens only. Consolidate into must-fix
          and should-fix, each with the file and line it applies to. Attach the report.
      - agentName: senior-dev
        approvalGate: false
        attachmentsFromPrevious: true
        name: Apply review fixes
        prompt: Apply every must-fix from the attached code review on branch {{branchName}}. Re-run the
          tests, including E2E. Commit.
      - agentName: librarian
        approvalGate: false
        attachmentsFromPrevious: true
        name: Librarian
        prompt: Update the internal wiki to reflect how the codebase actually works after this change. Do
          not change product code.
      - agentName: human
        approvalGate: true
        attachmentsFromPrevious: true
        name: Human review of deployment / PR
        prompt: Check out branch {{branchName}}, review the PR, and merge it. Nothing else runs until you
          close this card.
    variables:
      - branchName
      - feature
