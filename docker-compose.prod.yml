# Production stack for Coolify (RECIPE A8).
#
# Coolify supplies four things this file leans on, so that you configure as
# little as possible by hand:
#
#   SERVICE_FQDN_*  — declares a domain for a service+port. Coolify assigns it
#                     from your wildcard domain and points the proxy at it.
#   SERVICE_URL_*   — the same thing with its scheme, for use as a value.
#   SERVICE_HEX_*   — a generated secret, stable across deploys and visible in
#                     the Coolify UI so you can read it back.
#   ${VAR:?}        — required. The deploy fails and the field is flagged red
#                     rather than the stack booting half-configured.
#
# Only `api` and `web` get domains. Postgres and Redis are reached over the
# private network and are never published — no `ports:` anywhere on purpose.

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      # Declaring these two is what makes Coolify hand out the domains. The
      # port suffix tells the proxy where to send traffic.
      - SERVICE_FQDN_API_3001
      - SERVICE_FQDN_WEB_80
      - NODE_ENV=production
      - API_PORT=3001
      # The browser origin allowed to call this API, and the origin agents hand
      # out as their webhook URL. Both come from Coolify's own assignment, so
      # there is no third place to keep them in sync.
      - WEB_ORIGIN=${SERVICE_URL_WEB_80}
      - PUBLIC_URL=${SERVICE_URL_API_3001}
      - DATABASE_URL=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/agentos
      - REDIS_URL=redis://redis:6379
      # Generated by Coolify and readable in its UI — this is the token you
      # paste into the web app on first load.
      - AGENTOS_OPERATOR_TOKEN=${SERVICE_HEX_64_OPERATOR}
      # Derives every trigger's signing key. Generated, so rotating your login
      # never silently rotates your webhooks.
      - WEBHOOK_MASTER_SECRET=${SERVICE_HEX_64_WEBHOOK}
      # Required: without a credential no agent can run at all, and finding
      # that out from a failed session is worse than finding it out here.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:?}
      - ANTHROPIC_WORKSPACE=${ANTHROPIC_WORKSPACE:-default}
      # Required: the agent filesystem lives here. An agent that cannot write
      # its own notes fails in a much more confusing way than a failed deploy.
      - S3_ENDPOINT=${S3_ENDPOINT:?}
      - S3_REGION=${S3_REGION:-auto}
      - S3_BUCKET=${S3_BUCKET:?}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:?}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:?}
      # Optional. Unset means push is cleanly disabled, not broken.
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:operator@localhost}
      # Optional second backend. Blank keeps every session on the cloud runner.
      - LOCAL_RUNNER_URL=${LOCAL_RUNNER_URL:-}
      - LOCAL_RUNNER_TOKEN=${LOCAL_RUNNER_TOKEN:-}
      # Error reporting. Blank keeps failures in the log and off the network.
      - GLITCHTIP_DSN=${GLITCHTIP_DSN:-}
      - DEPLOY_ENV=${DEPLOY_ENV:-production}
      - RELEASE=${RELEASE:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3001"
    healthcheck:
      # Coolify waits for this before it routes traffic, so a deploy that
      # cannot reach its database never takes over from the running one.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the bundle at build time: the browser needs an absolute
        # API origin, and Coolify passes build variables separately from
        # runtime ones. Set VITE_API_URL explicitly if the built bundle ever
        # points at the wrong origin — build-time magic variables are the one
        # part of this file that depends on Coolify's version.
        VITE_API_URL: ${VITE_API_URL:-${SERVICE_URL_API_3001}}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      # Generated once and reused: the api service above references the same
      # identifiers, so the credential exists in exactly one place.
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=agentos
    volumes:
      # Named volume, so Coolify manages it as persistent storage and a
      # redeploy never touches it. The Postgres 18 image wants the whole
      # directory mounted, not just `/data`.
      - agentos_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SERVICE_USER_POSTGRES} -d agentos"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # Append-only, because the queue holds scheduled work: a restart that
    # forgot its schedulers would silently stop every cron trigger.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - agentos_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  agentos_pg:
  agentos_redis:
